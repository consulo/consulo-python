    text: Decimal
fstring.format.spec.entry.fixed.full:
    text: 'Fixed-point notation. For a given precision p, formats the number as a decimal number with exactly p digits following the decimal point. With no precision given, uses a precision of 6 digits after the decimal point for float, and uses a precision large enough to show all coefficient digits for Decimal. If p=0, the decimal point is omitted unless the # option is used.'
fstring.format.spec.entry.fixed.short:
    text: Fixed-point
fstring.format.spec.entry.fixed.upper.full:
    text: Fixed-point notation. Same as 'f', but converts nan to NAN and inf to INF.
fstring.format.spec.entry.fixed.upper.short:
    text: Fixed-point (uppercase)
fstring.format.spec.entry.general.lower.full:
    text: 'General format. For a given precision p >= 1, this rounds the number to p significant digits and then formats the result in either fixed-point format or in scientific notation, depending on its magnitude. A precision of 0 is treated as equivalent to a precision of 1. The precise rules are as follows: suppose that the result formatted with presentation type ''e'' and precision p-1 would have exponent exp. Then, if m <= exp < p, where m is -4 for floats and -6 for Decimals, the number is formatted with presentation type ''f'' and precision p-1-exp. Otherwise, the number is formatted with presentation type ''e'' and precision p-1. In both cases insignificant trailing zeros are removed from the significand, and the decimal point is also removed if there are no remaining digits following it, unless the ''#'' option is used.'
fstring.format.spec.entry.general.lower.short:
    text: General (lowercase)
fstring.format.spec.entry.general.upper.full:
    text: General format. Same as 'g' except switches to 'E' if the number gets too large. The representations of infinity and NaN are uppercased, too.
fstring.format.spec.entry.general.upper.short:
    text: General (uppercase)
fstring.format.spec.entry.hex.lower.full:
    text: Hex format. Outputs the number in base 16, using lower-case letters for the digits above 9.
fstring.format.spec.entry.hex.lower.short:
    text: Hex (lowercase)
fstring.format.spec.entry.hex.upper.full:
    text: Hex format. Outputs the number in base 16, using upper-case letters for the digits above 9. In case '#' is specified, the prefix '0x' will be upper-cased to '0X' as well.
fstring.format.spec.entry.hex.upper.short:
    text: Hex (uppercase)
fstring.format.spec.entry.hour12.full:
