fstring.format.spec.entry.coerce.zero.full:
    text: Coerces negative zero floating-point values to positive zero after rounding to the format precision. This option is only valid for floating-point presentation types. (Added in Python 3.11, see PEP 682)
fstring.format.spec.entry.coerce.zero.short:
    text: Coerce negative zero
fstring.format.spec.entry.comma.full:
    text: Inserts a comma every 3 digits for integer presentation type 'd' and floating-point presentation types, excluding 'n'. For other presentation types, this option is not supported. (Added in Python 3.1, see PEP 378)
