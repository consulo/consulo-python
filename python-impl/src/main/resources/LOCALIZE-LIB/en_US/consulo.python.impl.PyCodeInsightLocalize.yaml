inlay.parameters.python.hints.blacklist.explanation:
  text: <p>To disable hints for a method or a function, use one of the following patterns:</p><ul><li><code><b>(*info)</b></code> - all functions with a single parameter whose name ends with <em>info</em><br></li><li><code><b>(a, b)</b></code> - all functions with parameters <em>a</em> and <em>b</em><br></li><li><code><b>*.put(self, key, value)</b></code> - all <em>put</em> methods with parameters <em>key</em> and <em>value</em><br></li><li><code><b>Foo.bar(self, a, b)</b></code> - method <em>bar</em> of class <em>Foo</em> with parameters <em>a</em> and <em>b</em><br></li><li><code><b>foo(\&lt;star\&gt;\&lt;star\&gt;kwargs)</b></code> - function <em>foo</em> with parameter <em>**kwargs</em><br></li></ul><p>Names or placeholders must be provided for all parameters, including the optional ones.<br>Qualified method names must include class names or placeholders for them.<br>Use the "Do not show hints for current method" {0} action to add patterns from the editor.</p>
